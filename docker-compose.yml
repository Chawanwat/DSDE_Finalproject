# Usage
#   docker compose up -d                      Kafka + Kafka UI + dashboard + Jupyter
#   docker compose run --rm app bash          shell with every dependency installed
#   docker compose --profile data up dataset          download + extract the CCTV dataset (~1.6 GB zip)
#   docker compose --profile pipeline up pipeline     dataset (if missing) + full Prefect pipeline
#   docker compose down                       stop everything (add -v to wipe Kafka data)
#
# Ports: dashboard http://localhost:8501 · Jupyter http://localhost:8888
#        Kafka UI http://localhost:8080 · Kafka from your Mac: localhost:9092

x-app: &app
  build: .
  image: bkk-cctv:latest
  env_file:
    - path: .env
      required: false
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PREFECT_HOME: /app/.prefect
  volumes:
    - .:/app            # live code + data/ + models/ shared with your machine
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0          # single-node KRaft (no ZooKeeper)
    container_name: bkk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bkk-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bkk-cctv
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  dashboard:
    <<: *app
    container_name: bkk-dashboard
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"

  jupyter:
    <<: *app
    container_name: bkk-jupyter
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --notebook-dir=/app
    ports:
      - "8888:8888"

  # Download + extract the dataset into ./data (once; skips if already there)
  #   docker compose --profile data up dataset
  dataset:
    <<: *app
    profiles: ["data", "pipeline"]
    depends_on: {}
    command: python -m bkk_cctv.ingest.download_images

  # Interactive shell: docker compose run --rm app bash
  app:
    <<: *app
    profiles: ["tools"]
    command: bash

  # One-off full pipeline run: docker compose --profile pipeline up pipeline
  pipeline:
    <<: *app
    profiles: ["pipeline"]
    command: python -m bkk_cctv.pipeline.flow
    depends_on:
      dataset:
        condition: service_completed_successfully

volumes:
  kafka-data:
