[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bkk-cctv"
version = "0.1.0"
description = "Bangkok CCTV image analysis — DSDE 2110403 final project"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt (single source of truth).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
