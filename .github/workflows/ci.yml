name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light install only: skip torch/YOLO so CI stays fast
      - run: pip install pandas pyarrow pyyaml python-dotenv pytest ruff && pip install -e . --no-deps
      - run: ruff check src tests dashboard
      - run: pytest
