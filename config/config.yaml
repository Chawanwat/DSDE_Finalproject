# Central config — all paths are relative to the project root
paths:
  raw_images: data/raw/images
  interim: data/interim
  processed: data/processed
  external: data/external
  reference: data/reference
  models: models

drive:
  # Shared CCTV dataset folder from the project slides
  folder_url: https://drive.google.com/drive/folders/1k2-KxXe4wbDmFGcGXI-pK7TdSXjBHTni
  images_zip_id: 1mHP-N0qtbBy5IxhjZVovP_8g1Hw2H7dO   # cctv_images.zip (~1.6 GB)
  info_file_id: 1VSCzWeNOV7ds_d9BNJ9i20_9JzyncL2F    # cctv_info.csv (100 cameras)

clean:
  min_brightness: 20      # mean pixel value below this = too dark
  min_blur_var: 50        # Laplacian variance below this = too blurry
  dup_hash_distance: 2    # perceptual-hash distance for duplicate/frozen frames

detect:
  model: yolov8n.pt
  conf: 0.25
  # COCO class ids: 2 car, 3 motorcycle, 5 bus, 7 truck
  classes: [2, 3, 5, 7]
  batch_size: 32
